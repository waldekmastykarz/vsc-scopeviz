name: Sync VS Code version

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: write

jobs:
  sync:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@v7.0.1

      - name: Check out Dependabot branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pull-request
          fetch-depth: 0

      - name: Align VS Code versions
        run: node .github/scripts/sync-vscode-version.mjs --cwd pull-request

      - name: Commit aligned versions
        id: commit
        working-directory: pull-request
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Align VS Code engine version"
          git push origin "HEAD:${HEAD_REF}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Validate updated branch
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: gh workflow run pr-check.yml --ref "$HEAD_REF"
